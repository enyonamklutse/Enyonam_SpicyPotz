<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/69b7f0c38b.js" crossorigin="anonymous"></script>
    <title>Login | Spicy Potz</title>
    <link rel="stylesheet" href="../src/style.css">
</head>
<body class="page-body">
  <header class="topbar">
    <div class="container topbar-inner">
      <a href="index.html" class="brand" aria-label="Spicy Potz home">
        <img src="../images/logo1.jpg" alt="Spicy Potz logo" class="brand-mark">
        <span class="brand-name">Spicy Potz</span>
      </a>
      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">☰</button>
      <nav aria-label="Main navigation">
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="menu.html">Menu</a></li>
          <li><a href="reservation.html">Reservation</a></li>
          <li><a href="gallery.html">Gallery</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="page-shell auth-layout">
    <div class="auth-visual">
      <img src="../images/ChatGPT Image Jul 30, 2026, 07_39_36 AM.png" alt="Spicy Potz lifestyle image">
    </div>

    <div class="signup-card">
      <span class="eyebrow">Welcome back</span>
      <h2>Login to your account</h2>
      <form action="" method="get" class="form-grid">
        <div class="form-row">
          <label for="Email">Email:</label>
          <input type="email" name="Email" id="Email" required>
        </div>

        <div class="form-row">
          <label for="Password">Password:</label>
          <input type="password" name="Password" id="Password" required>
        </div>

        <a href="https://support.google.com/" target="_blank" rel="noopener noreferrer" class="muted-link">Forgot password?</a>

        <button type="submit" class="btn btn-primary form-submit">Login</button>
      </form>

      <div style="margin-top: 1.5rem; display: flex; gap: 1rem; justify-content: center;">
        <a href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-youtube fa-2xl" style="color: rgb(255, 59, 59);"></i></a>
        <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-instagram fa-2xl" style="color: rgb(255, 59, 59);"></i></a>
        <a href="https://x.com/" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-x-twitter fa-2xl" style="color: rgb(255, 59, 59);"></i></a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>Spicy Potz • Crafted for memorable moments</p>
    </div>
  </footer>

  <script src="../src/script.js"></script>
</body>
</html>
